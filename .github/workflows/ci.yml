name: local-contracts
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.15.0'
      - uses: hustcer/setup-moonbit@9165e0d7de62340ee5402e271bc5abc732cef84d
        with:
          version: '0.10.17+d971670cd'
          core-version: '0.10.17+d971670cd'
      - run: moon version --all
      - run: node tools/build.mjs
      - name: Shared format and task corpus
        run: node --test tests/core.test.mjs tests/bundle.test.mjs tests/tasks.test.mjs tests/contracts.test.mjs
      - name: POSIX interruption and permission contracts
        if: runner.os != 'Windows'
        run: node --test tests/io.test.mjs
      - run: moon test src --target js
      - run: moon test src --target wasm-gc
      - if: runner.os != 'Windows'
        run: moon test src --target native
      - run: node tools/ci_smoke.mjs
  independent-oracles:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.15.0'
      - uses: hustcer/setup-moonbit@9165e0d7de62340ee5402e271bc5abc732cef84d
        with:
          version: '0.10.17+d971670cd'
          core-version: '0.10.17+d971670cd'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - run: sudo apt-get update && sudo apt-get install -y pspp time
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m unittest discover -s tests -p '*_test.py'
      - run: python tools/verify.py --all --require-public --require-pspp --output evidence/ci-run
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: compatibility-evidence
          path: |
            evidence/ci-run/summary.json
            evidence/ci-run/run.json
            evidence/ci-run/**/result.json
            evidence/ci-run/**/results.json
          if-no-files-found: error
